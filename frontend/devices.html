<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الأجهزة - Smart Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand">🔬 Smart Lab</div>
      <div class="nav-links">
        <a href="dashboard.html">الرئيسية</a>
        <a href="book.html">حجز جهاز</a>
        <a href="#" onclick="logout()">تسجيل الخروج</a>
      </div>
    </nav>

    <div class="dashboard-container">
      <h2 class="page-title">💻 الأجهزة المتاحة</h2>
      <div class="devices-grid" id="devices-grid">
        <p>جاري التحميل...</p>
      </div>
    </div>

    <script>
      const API = 'http://127.0.0.1:5000';
      const token = localStorage.getItem('token');

      if (!token) window.location.href = 'login.html';

      async function loadDevices() {
        try {
          const res = await fetch(API + '/devices', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const devices = await res.json();
          const grid = document.getElementById('devices-grid');
          grid.innerHTML = '';

          devices.forEach(device => {
            const statusAr = device.status === 'Available' ? 'متاح' :
                             device.status === 'Reserved' ? 'محجوز' : 'صيانة';
            const statusClass = device.status === 'Available' ? 'available' :
                                device.status === 'Reserved' ? 'reserved' : 'maintenance';
            const btn = device.status === 'Available'
              ? `<a href="book.html?id=${device.id}" class="action-btn">احجز الآن</a>`
              : `<button class="action-btn disabled" disabled>غير متاح</button>`;

            grid.innerHTML += `
              <div class="device-card ${statusClass}">
                <div class="device-icon">🖥️</div>
                <h3>${device.name}</h3>
                <p class="device-status">${statusAr}</p>
                ${btn}
              </div>`;
          });
        } catch (err) {
          document.getElementById('devices-grid').innerHTML = '<p>خطأ في تحميل الأجهزة</p>';
        }
      }

      function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
      }

      loadDevices();
    </script>
  </body>
</html>
