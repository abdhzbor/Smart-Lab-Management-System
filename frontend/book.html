<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حجز جهاز - Smart Lab</title>
    <link rel="stylesheet" href="../static/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand">🔬 Smart Lab</div>
      <div class="nav-links">
        <a href="dashboard.html">الرئيسية</a>
        <a href="devices.html">الأجهزة</a>
        <a href="login.html">تسجيل الخروج</a>
      </div>
    </nav>

    <div class="dashboard-container">
      <h2 class="page-title">📅 حجز جهاز</h2>

      <div class="book-container">
        <form action="confirm.html">
          <div class="form-group">
            <label>اختر الجهاز</label>
            <select name="device_id">
              <option value="">-- اختر جهاز --</option>
              <option value="1">جهاز 1</option>
              <option value="2">جهاز 2</option>
              <option value="4">جهاز 4</option>
              <option value="6">جهاز 6</option>
            </select>
          </div>

          <div class="form-group">
            <label>وقت البداية</label>
            <input type="datetime-local" name="start_time" />
          </div>

          <div class="form-group">
            <label>وقت النهاية</label>
            <input type="datetime-local" name="end_time" />
          </div>

          <button type="submit">تأكيد الحجز</button>
        </form>
      </div>
    </div>
  </body>
</html>
