<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تأكيد الحجز - Smart Lab</title>
    <link rel="stylesheet" href="../static/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand">🔬 Smart Lab</div>
      <div class="nav-links">
        <a href="dashboard.html">الرئيسية</a>
        <a href="devices.html">الأجهزة</a>
        <a href="login.html">تسجيل الخروج</a>
      </div>
    </nav>

    <div class="dashboard-container">
      <div class="confirm-container">
        <div class="confirm-icon">✅</div>
        <h2>تم الحجز بنجاح!</h2>
        <p>تم تأكيد حجزك بنجاح، يمكنك مراجعة تفاصيل الحجز أدناه</p>

        <div class="confirm-details">
          <div class="confirm-row">
            <span class="confirm-label">الجهاز</span>
            <span class="confirm-value">جهاز 1</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">وقت البداية</span>
            <span class="confirm-value">10:00 AM</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">وقت النهاية</span>
            <span class="confirm-value">12:00 PM</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">الحالة</span>
            <span class="confirm-value status-confirmed">مؤكد ✓</span>
          </div>
        </div>

        <div class="confirm-actions">
          <a href="devices.html" class="action-btn">حجز جهاز آخر</a>
          <a href="dashboard.html" class="action-btn secondary-btn">الرئيسية</a>
        </div>
      </div>
    </div>
  </body>
</html>
