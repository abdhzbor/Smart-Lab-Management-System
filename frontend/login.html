<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - Smart Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>🔬 Smart Lab</h2>
      <h3>تسجيل الدخول</h3>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="username" placeholder="أدخل اسم المستخدم" required />
        </div>

        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور" required />
        </div>

        <p id="error-msg" style="color:red; display:none;"></p>
        <button type="submit">دخول</button>
      </form>
    </div>

    <script>
      const API = 'http://127.0.0.1:5000';

      async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
          const res = await fetch(API + '/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();

          if (data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('role', data.role);
            if (data.role === 'Admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          } else {
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('error-msg').textContent = 'خطأ: ' + data.message;
          }
        } catch (err) {
          document.getElementById('error-msg').style.display = 'block';
          document.getElementById('error-msg').textContent = 'تعذر الاتصال بالسيرفر';
        }
      }
    </script>
  </body>
</html>
