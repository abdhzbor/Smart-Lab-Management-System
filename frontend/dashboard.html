<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة الرئيسية - Smart Lab</title>
    <link rel="stylesheet" href="../static/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand">🔬 Smart Lab</div>
      <div class="nav-links">
        <a href="devices.html">الأجهزة</a>
        <a href="book.html">حجز جهاز</a>
        <a href="login.html">تسجيل الخروج</a>
      </div>
    </nav>

    <div class="dashboard-container">
      <div class="welcome-box">
        <h2>👋 أهلاً بك!</h2>
        <p>مرحباً في نظام إدارة المختبر الذكي</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">💻</div>
          <div class="stat-info">
            <h3>الأجهزة المتاحة</h3>
            <p class="stat-number">8</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">📅</div>
          <div class="stat-info">
            <h3>حجوزاتي</h3>
            <p class="stat-number">2</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">⏰</div>
          <div class="stat-info">
            <h3>حجوزات اليوم</h3>
            <p class="stat-number">5</p>
          </div>
        </div>
      </div>

      <div class="quick-actions">
        <h3>إجراءات سريعة</h3>
        <div class="actions-grid">
          <a href="devices.html" class="action-btn">عرض الأجهزة</a>
          <a href="book.html" class="action-btn">حجز جهاز</a>
        </div>
      </div>
    </div>
  </body>
