<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة الرئيسية - Smart Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand">🔬 Smart Lab</div>
      <div class="nav-links">
        <a href="devices.html">الأجهزة</a>
        <a href="book.html">حجز جهاز</a>
        <a href="#" onclick="logout()">تسجيل الخروج</a>
      </div>
    </nav>

    <div class="dashboard-container">
      <div class="welcome-box">
        <h2>👋 أهلاً بك!</h2>
        <p>مرحباً في نظام إدارة المختبر الذكي</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">💻</div>
          <div class="stat-info">
            <h3>الأجهزة المتاحة</h3>
            <p class="stat-number" id="available-count">...</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">🔴</div>
          <div class="stat-info">
            <h3>الأجهزة المحجوزة</h3>
            <p class="stat-number" id="reserved-count">...</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">🔧</div>
          <div class="stat-info">
            <h3>تحت الصيانة</h3>
            <p class="stat-number" id="maintenance-count">...</p>
          </div>
        </div>
      </div>

      <div class="quick-actions">
        <h3>إجراءات سريعة</h3>
        <div class="actions-grid">
          <a href="devices.html" class="action-btn">عرض الأجهزة</a>
          <a href="book.html" class="action-btn">حجز جهاز</a>
        </div>
      </div>
    </div>

    <script>
      const API = 'http://127.0.0.1:5000';
      const token = localStorage.getItem('token');

      if (!token) window.location.href = 'login.html';

      async function loadStats() {
        try {
          const res = await fetch(API + '/devices', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const devices = await res.json();

          const available = devices.filter(d => d.status === 'Available').length;
          const reserved = devices.filter(d => d.status === 'Reserved').length;
          const maintenance = devices.filter(d => d.status === 'Maintenance').length;

          document.getElementById('available-count').textContent = available;
          document.getElementById('reserved-count').textContent = reserved;
          document.getElementById('maintenance-count').textContent = maintenance;
        } catch (err) {
          console.error('خطأ في تحميل البيانات');
        }
      }

      function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
      }

      loadStats();
    </script>
  </body>
</html>
